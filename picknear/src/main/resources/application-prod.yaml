server:
  port: 8082
  tomcat:
    max-connections: 1000
    accept-count: 1000
    threads:
      max: 500

management:
  health:
    rabbit:
      enabled: false

spring:
  config:
    activate:
      on-profile: prod
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/heima?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # 密码一律从环境变量注入（compose 的 .env），配置里不再出现明文
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: 192.168.49.130
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          time-between-eviction-runs: 10s
  rabbitmq:
    host: 192.168.49.130
    password: ${RABBITMQ_PASSWORD}
    username: ${RABBITMQ_USERNAME:qyh}
    virtual-host: /
  sql:
    init:
      mode: never
  # Flyway：schema 增量变更的唯一入口（只在 prod 启用，本地开发不受影响）
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    # 现有库由 db/heima-init.sql 初始化（compose 挂载 initdb.d，仅数据卷为空时执行），
    # 之前没有版本记录。首次接管时开启 baseline，把当前 schema 记为版本 1，
    # 否则 Flyway 会报 "Found non-empty schema without metadata table"。
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Baseline: heima-init.sql 初始 schema"
    # 校验已应用脚本的 checksum，防止有人回头改历史脚本（改了会启动失败，逼着你写新版本）
    validate-on-migrate: true
    # 版本必须递增：不允许后写的旧版本脚本补跑，避免历史顺序错乱
    out-of-order: false

mybatis-plus:
  type-aliases-package: com.hmdp.entity,com.hmdp.shop.entity,com.hmdp.voucher.entity,com.hmdp.user.entity,com.hmdp.content.entity

# logging:
#   level:
#     com.hmdp: WARN
#     com.hmdp.agent: DEBUG                     # AI Agent 链路（含工具调用/守卫/规划/Hook 子域）
#     com.hmdp.agent.tool: DEBUG                # 工具注册细节
  

debug: false

app:
  oss:
    region: cn-beijing
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket: ntwitm1
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
