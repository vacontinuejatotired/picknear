server:
  port: 8082
  tomcat:
    max-connections: 1000
    accept-count: 1000
    threads:
      max: 500

management:
  health:
    rabbit:
      enabled: false

spring:
  config:
    activate:
      on-profile: prod
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/heima?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # 密码一律从环境变量注入（compose 的 .env），配置里不再出现明文
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: 192.168.49.130
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          time-between-eviction-runs: 10s
  rabbitmq:
    host: 192.168.49.130
    password: ${RABBITMQ_PASSWORD}
    username: ${RABBITMQ_USERNAME:qyh}
    virtual-host: /
  sql:
    init:
      mode: never

mybatis-plus:
  type-aliases-package: com.hmdp.entity,com.hmdp.shop.entity,com.hmdp.voucher.entity,com.hmdp.user.entity,com.hmdp.content.entity

# logging:
#   level:
#     com.hmdp: WARN
#     com.hmdp.agent: DEBUG                     # AI Agent 链路（含工具调用/守卫/规划/Hook 子域）
#     com.hmdp.agent.tool: DEBUG                # 工具注册细节
  

debug: false

app:
  oss:
    region: cn-beijing
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket: ntwitm1
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
