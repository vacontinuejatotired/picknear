# 默认 profile：dev（本地开发）。生产由 docker-compose 显式指定 SPRING_PROFILES_ACTIVE=prod。
# 各 profile 差异见 application-dev.yaml / application-prod.yaml。
spring:
  profiles:
    active: dev
  application:
    name: hmdp
  task:
    scheduling:
      pool:
        size: 4          # ObservedSseEmitter 兜底 guard 的调度线程数（Boot 默认 1，超时风暴时 guard 排队延迟兜底）
  ai:
    chat:
      client:
      ##允许多个模型，每个模型都有自己的配置
        enabled: false
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: mariadb
    ## MaaS compatible-mode 端点：OpenAI 兼容协议。base-url 到 /compatible-mode 为止
    ## （SDK completionsPath 默认 /v1/chat/completions，会自动拼接；带 /v1 会变成 .../v1/v1/chat/completions 404）。
    ## DashScope 经典路径 /api/v1/services/aigc/text-generation/generation 会被 MaaS 网关静默丢连接。
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://ws-mhs2k50uiwwwvefx.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        ## 必须用 options.model！OpenAiChatProperties 无 model 字段，chat.model 会被忽略，
        ## 构造器硬编码默认 gpt-4o-mini，MaaS 端点不认会 404/断连（2026-08-07 wiretap 实测）
        options:
          model: qwen-plus-2025-07-28

management:
  otlp:
    tracing:
      # 观测后端接入参数唯一事实源（导出去哪）：默认 Langfuse 云；切 Jaeger/SigNoz/Tempo 只改此处
      # （endpoint/headers/凭据都在这里，行为层由 hmdp.ai-observability.backend 决定）
      # OTLP 端点必须带 /v1/traces（实测：OTel SDK 1.43 不自动追加，不带则 404）
      endpoint: ${LANGFUSE_BASE_URL}/api/public/otel/v1/traces
      headers:
        Authorization: Basic ${LANGFUSE_BASIC_AUTH}
        x-langfuse-ingestion-version: "4"   # Langfuse 专有头：实时摄取（v3 批量约 5s 延迟）
      timeout: 15s                           # OTLP导出超时（Langfuse JP延迟约3-4s，留足余量）
  tracing:
    sampling:
      probability: 1.0               # 验证期全量；日常 0.1（架构文档 §6.6）

hmdp:
  ai-observability:
    backend:
      type: langfuse                 # 观测后端：langfuse|jaeger|signoz|collector|console|noop（缺省 langfuse；接入参数走 management.otlp.tracing.*）
    trace-enabled: true              # 业务埋点总开关（M2 使用）
    trace-filter:
      include-prefixes:              # 观测白名单：backend 能力默认前缀 + 本清单追加（用户不可删除默认项）
        - agent.                     # M2 业务 span（agent.session/phase1/round/tool_call...）
        - spring.ai.                 # LLM client 层（spring.ai.chat.client）
        - gen_ai.                    # LLM model 层（gen_ai.client.operation）
    chat-observation:
      include-content: true          # LLM 请求/回复全文写入 gen_ai.request/response.content（true|false|auto；auto=跟后端能力）
    span-naming:
      semantic-encoding: auto        # 语义后缀编码进 span 名：auto=跟后端能力；true/false 强制覆盖（调试/口径迁移）
  prompt-guard:
    block-tools:
      - deleteBlog
    confirm-tools:
      - publishTestBlog
    block-patterns:
      - toolName: ".*[Dd]elete.*"
    confirm-patterns:
      - arguments: ".*admin.*"
    rate-limit:
      max-per-session: 30
      window-seconds: 60
    approval:
      enabled: true                # CONFIRM 真暂停总开关；false 时退回旧行为（提示字符串当工具结果）
      ttl-seconds: 300             # 审批有效期（秒），超时自动过期
    tool-result:
      max-chars: 1200              # 工具结果回灌 LLM 前最大字符数（防上下文膨胀，≤0 不截断）

#logging:
#  level:
#    com.hmdp: debug                            # 其他 hmdp 包安静
#    com.hmdp.agent: DEBUG                     # AI Agent 主链路（含守卫/规划/Hook 子域）
#    com.hmdp.agent.tool: DEBUG                # 工具调用细节
#    com.hmdp.interceptor: DEBUG                       # 拦截器链执行

agent:
  subtask:
    timeout: 30s                              # 子 Agent 单次 LLM 调用超时
    total-timeout: 60s                        # 整个 execute() 总超时（含重试）
    max-retries: 3                            # 最大重试次数
    retry-backoff: 1s                         # 重试基础退避间隔
    max-tool-rounds: 6                        # 手动工具循环最大轮数（触顶强制总结）
    max-total-calls: 10                       # 单次执行总工具调用数上限（预算硬顶，超限强制收尾）
    tool-loop: batch                         # 工具循环策略：serial=按轮逐个（默认）；batch=批量+并行
    parallel-tools: true                      # batch 用：轮内多个工具并发执行
    parallel-compress: true                   # batch 用：轮内多个长结果压缩并发（N×4s → ~4s）
    compress-length: 80                       # 工具结果压缩摘要最大字符数（防上下文滚雪球）
    dag:
      default-max-retries: 3                  # 全局默认最大重试次数（工具未声明时使用）
      default-retry-enabled: true             # 全局默认是否允许重试
      default-retry-base-delay-ms: 1000       # 全局默认重试基础延迟（毫秒）
      retry:
        strategy: exponential                 # 重试策略：exponential（指数退避）/ none（不重试）
        enabled: true                         # 全局重试开关
        base-delay-ms: 1000                   # 重试基础延迟（毫秒）
        retryable-errors:                     # 可重试的异常类名（兜底配置，工具级 @ToolMeta 优先）
          - SocketTimeoutException
          - ConnectException
          - IOException
  prompt:
    enabled: true                             # 提示词外置总开关（false → 全部走内置模板）
    repository:
      type: langfuse                          # langfuse（默认）| none（显式无远程，走内置模板）
    base-url: ${LANGFUSE_BASE_URL:}           # 仓库实现读取（langfuse 时用）；空 = 无远程（Fail-Open）
    basic-auth: ${LANGFUSE_BASIC_AUTH:}       # langfuse Basic 认证（裸 base64）
    default-label: production                 # 默认拉取 label
    cache-ttl: 30m                             # 成功文本 / 404 负缓存 TTL（启动预热后请求期基本全命中）
    failure-cache-ttl: 30s                    # 网络失败瞬时熔断 TTL
    timeout: 5s                               # RestClient 建连/读超时（实测容器到 Langfuse JP 约 1.3s）
    tool-description-enabled: true            # 工具描述外置开关（false → 回退 @Tool 注解）
    seed-enabled: false                       # 种子/清缓存端点开关（生产编排后关闭）

feature:
  subagent:
    enabled: true                             # 子 Agent 功能开关
  tool-routing:
    enabled: true                             # 规划工具路由：true=意图→工具组两级路由（默认）；false=legacy 紧凑目录+UNCERTAIN 全量重跑
    max-tag-length: 60                        # 紧凑标签最大字符数

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true