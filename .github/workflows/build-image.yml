name: Build Image

on:
  # 手动触发（可指定 tag）
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest）'
        required: false
        default: 'latest'
  # 自动触发：push 到发布分支 master 即构建推送（feature 开发不触发）
  push:
    branches: ['master']
    paths-ignore:
      - 'md/**'
      - '*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-gbihc3e57h3o3f2l.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: picknear
          push: true
          # ACR 个人版不支持 provenance/sbom 附件（unknown manifest class 报错），必须关闭
          provenance: false
          sbom: false
          # GHA 层缓存：显式 scope 避免与仓库内其他 job/workflow 的缓存挤占淘汰
          # （曾试 type=registry 兜底，ACR 个人版拒绝 buildkit cacheconfig manifest
          #  "unknown manifest class"，故仅用 GHA 缓存）
          cache-from: type=gha,scope=picknear-app
          cache-to: type=gha,mode=max,scope=picknear-app
          tags: |
            crpi-gbihc3e57h3o3f2l.cn-hangzhou.personal.cr.aliyuncs.com/picknear/picknear-app:${{ inputs.tag || 'latest' }}
            crpi-gbihc3e57h3o3f2l.cn-hangzhou.personal.cr.aliyuncs.com/picknear/picknear-app:latest
