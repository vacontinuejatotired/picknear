name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    # 默认只有 opened/synchronize/reopened；文档同步豁免流程依赖
    # 改 PR 描述（edited）与打标签（labeled/unlabeled），必须显式补上，
    # 否则改描述/打标签不会重跑 CI，豁免无法生效。
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # 手动触发（可指定 tag）
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest）'
        required: false
        default: 'latest'

# 并发控制：同一 ref 上的多次触发排队执行，避免两个 build-image 并行跑、
# 谁后完成谁覆盖 latest（可能把旧 commit 推成 latest）。
# PR 事件可以取消（纯粹是验证，没有副作用）；push/手动触发排队等，不中断。
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================
  # Changes：区分代码变更与纯文档变更
  # 所有 push 都跑 CI / 通知，但纯文档 push 不构建镜像
  # ==========================================
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | grep -Ev '^$|(^|/)md/|\.md$' >/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================
  # CI：编译 + 单测（所有分支、PR 均跑）
  # ==========================================
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # doc-sync gate 需要 merge-base 做三元点 diff（base...head），
          # 浅克隆取不到共同祖先，必须全量历史。
          fetch-depth: 0

      - name: docs-check
        run: python3 scripts/docs/check_docs.py

      # ==========================================================
      # 文档同步门禁（分层②）
      # observe 期：只往 job summary 写判定报告，不改退出码；
      # 切 enforce 后：must 违规且无豁免 → exit 1。
      # 判定逻辑见 md/规范/文档同步规范.md，运维见 md/ops/文档同步运维手册.md。
      # ==========================================================
      - name: docs-sync validate
        run: python3 scripts/docs/doc_sync_check.py --validate

      - name: docs-sync gate
        if: github.event_name == 'pull_request'
        env:
          DOC_SYNC_BASE: ${{ github.event.pull_request.base.sha }}
          DOC_SYNC_HEAD: ${{ github.event.pull_request.head.sha }}
          DOC_SYNC_PR_BODY: ${{ github.event.pull_request.body }}
          DOC_SYNC_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          {
            echo '```'
            python3 scripts/docs/doc_sync_check.py --gate \
              --base "$DOC_SYNC_BASE" --head "$DOC_SYNC_HEAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: docs-sync report
        if: always()
        run: |
          {
            echo '```'
            python3 scripts/docs/doc_sync_check.py --report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: picknear
        run: mvn compile -B -q

      - name: Unit tests
        working-directory: picknear
        run: |
          # 跳过需要 MySQL/Redis/RabbitMQ 的 @SpringBootTest 集成测试
          mvn test -B \
            -Dtest="\
              !com.hmdp.TokenTest,\
              !com.hmdp.agent.observability.AgentTracerIntegrationTest,\
              !com.hmdp.agent.observability.LangfuseSmokeTest,\
              !com.hmdp.PickNearApplicationTests" \
            -DfailIfNoTests=false

      # 失败排查：surefire 报告是云端唯一线索（runner 是一次性的，跑完即销毁）
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: picknear/target/surefire-reports/
          if-no-files-found: ignore

  # ==========================================
  # Build Image：构建镜像推 ACR（仅 push master + 手动触发）
  # 依赖 CI 通过才执行——CI 失败则不构建镜像
  # ==========================================
  build-image:
    needs: [ci, changes]
    if: >-
      needs.changes.outputs.code_changed == 'true'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/master')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Prepare image tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          IMAGE_REPOSITORY: crpi-gbihc3e57h3o3f2l.cn-hangzhou.personal.cr.aliyuncs.com/picknear/picknear-app
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          if [ -n "$INPUT_TAG" ] && ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $INPUT_TAG"
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE_REPOSITORY}:latest"
            echo "${IMAGE_REPOSITORY}:sha-${SHORT_SHA}"
            if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "latest" ] && [ "$INPUT_TAG" != "sha-${SHORT_SHA}" ]; then
              echo "${IMAGE_REPOSITORY}:${INPUT_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-gbihc3e57h3o3f2l.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: picknear
          push: true
          # ACR 个人版不支持 provenance/sbom 附件（unknown manifest class 报错），必须关闭
          provenance: false
          sbom: false
          # GHA 层缓存：显式 scope 避免与仓库内其他 job 的缓存挤占淘汰
          cache-from: type=gha,scope=picknear-app
          cache-to: type=gha,mode=max,scope=picknear-app
          # 镜像 tag：latest + sha-xxxxxxx + 手动触发时的自定义 tag
          tags: ${{ steps.tags.outputs.tags }}

  # ==========================================
  # 通知：所有 push + 手动触发，附带作者和提交说明
  # 推荐飞书自定义机器人；保留钉钉兼容，详见 md/ops/CI流水线.md
  # 未配置通知凭据时自动跳过，不影响流水线
  # ==========================================
  notify:
    needs: [changes, ci, build-image]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Get commit metadata
        id: commit
        shell: bash
        run: |
          author="$(git log -1 --pretty=format:'%an')"
          subject="$(git log -1 --pretty=format:'%s')"
          body="$(git log -1 --pretty=format:'%b')"
          {
            echo "author<<EOF"
            echo "$author"
            echo "EOF"
            echo "message<<EOF"
            echo "$subject"
            if [ -n "$body" ]; then
              echo
              echo "$body"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send notification
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_AUTHOR: ${{ steps.commit.outputs.author }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          NOTIFY_PROVIDER: ${{ vars.NOTIFY_PROVIDER || secrets.NOTIFY_PROVIDER }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SIGN_SECRET: ${{ secrets.DINGTALK_SIGN_SECRET }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: bash scripts/ci/notify.sh
